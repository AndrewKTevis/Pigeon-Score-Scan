name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: ${{ github.workspace }}\app\src
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install uv
        run: python -m pip install uv==0.9.26

      - name: Audit public tree
        run: python app/tools/check_public_tree.py .

      - name: Verify and install locked dependencies
        run: |
          uv lock --project app --check
          uv sync --project app --locked --group dev

      - name: Audit installed dependencies
        run: uv tool run --from pip-audit==2.10.1 pip-audit --path app/.venv/Lib/site-packages --progress-spinner off

      - name: Static checks
        run: |
          uv run --project app python -m compileall -q app/src app/tools app/tests
          node --check app/src/scorescan/web/app.js

      - name: Verify model manifest
        run: |
          uv run --project app python app/tools/generate_model_manifest.py --resources app/src/scorescan/resources
          git diff --exit-code -- app/src/scorescan/resources/model_manifest.json

      - name: Run test suite
        run: uv run --project app python -m pytest -q app/tests

      - name: Run portable self-test
        run: uv run --project app python -m scorescan --self-test --json --root .

      - name: Build deterministic source archive
        if: matrix.python-version == '3.12'
        run: uv run --project app python app/tools/build_release.py --source-root . --output-dir dist --version 0.38.0
