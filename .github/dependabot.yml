version: 2
updates:
  - package-ecosystem: uv
    directory: /app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      routine-runtime-updates:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # homr 0.7.0 requires opencv-python-headless <5.0.0.0.
      - dependency-name: opencv-python-headless
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      codeql-actions:
        patterns: ["github/codeql-action/*"]
