Global:
  model_name: PP-OCRv6_medium_rec
  debug: false
  use_gpu: true
  epoch_num: 18
  log_smooth_window: 20
  print_batch_step: 20
  save_model_dir: /workspace/pigeon-score-scan/training_data/models/ppocrv6-scorescan-rec-stratified-e18-b8-20260729
  save_epoch_step: 1
  eval_batch_step: [0, 1000]
  cal_metric_during_train: true
  pretrained_model: /workspace/pigeon-score-scan/training_data/external/models/paddleocr-ppocrv6-medium-rec-training/PP-OCRv6_medium_rec_pretrained
  checkpoints:
  save_inference_dir:
  use_visualdl: false
  character_dict_path: /workspace/pigeon-score-scan/training_data/external/corpora/paddleocr_2661c7c0/ppocr/utils/dict/ppocrv6_dict.txt
  max_text_length: &max_text_length 25
  infer_mode: false
  use_space_char: true
  distributed: false
  save_res_path: /workspace/pigeon-score-scan/training_data/models/ppocrv6-scorescan-rec-stratified-e18-b8-20260729/predicts.txt
  d2s_train_image_shape: [3, 48, 320]

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.00005
    warmup_epoch: 1
  regularizer:
    name: L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: PPLCNetV4
    model_size: medium
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: lightsvtr
            dims: 192
            depth: 2
            mlp_ratio: 4.0
            local_kernel: 7
            use_guide: false
          Head:
            fc_decay: 0.00001
      - NRTRHead:
          nrtr_dim: 512
          max_text_length: *max_text_length

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss:
    - NRTRLoss:

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: MultiScaleDataSet
    ds_width: false
    data_dir: /workspace/pigeon-score-scan
    ext_op_transform_idx: 1
    label_file_list:
      - /workspace/pigeon-score-scan/training_data/prepared/scorescan_ocr_training_stratified_v2/train.balanced.paddle.txt
    ratio_list:
      - 1.0
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - RecConAug:
          prob: 0.35
          ext_data_num: 2
          image_shape: [48, 320, 3]
          max_text_length: *max_text_length
      - RecAug:
      - MultiLabelEncode:
          gtc_encode: NRTRLabelEncode
      - KeepKeys:
          keep_keys:
            - image
            - label_ctc
            - label_gtc
            - length
            - valid_ratio
  sampler:
    name: MultiScaleSampler
    scales: [[320, 32], [320, 48], [320, 64]]
    first_bs: &bs 8
    fix_bs: false
    divided_factor: [8, 16]
    is_training: true
  loader:
    shuffle: true
    batch_size_per_card: *bs
    drop_last: true
    num_workers: 4

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /workspace/pigeon-score-scan
    label_file_list:
      - /workspace/pigeon-score-scan/training_data/prepared/scorescan_ocr_training_stratified_v2/calibration.scan.paddle.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - MultiLabelEncode:
          gtc_encode: NRTRLabelEncode
      - RecResizeImg:
          image_shape: [3, 48, 320]
      - KeepKeys:
          keep_keys:
            - image
            - label_ctc
            - label_gtc
            - length
            - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 32
    num_workers: 2
